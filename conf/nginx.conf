# NginxGo 简化配置文件

# 运行用户
user nobody;

# Worker 进程数
worker_processes 1;

# 错误日志
error_log logs/error.log;

# PID 文件
pid logs/nginx.pid;

# 事件配置
events {
    worker_connections 1024;
}

# HTTP 配置
http {
    # 默认 MIME 类型
    default_type application/octet-stream;

    # 发送文件
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 连接超时
    keepalive_timeout 65;

    # Gzip 压缩
    gzip on;

    # 服务器配置
    server {
        listen 80;
        server_name localhost;

        # 根目录
        root html;
        index index.html;

        # 静态文件
        location / {
            root html;
            index index.html;
        }
    }
}