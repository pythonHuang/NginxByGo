version: '3.8'

services:
  nginxgo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginxgo
    ports:
      - "8080:80"
    volumes:
      - ./html:/app/html
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
